# Cau hinh cho test tich hop. Muc tieu dau tien la KHONG BAO GIO cham vao Neon staging.
#
# Hai lop chan:
#   1. surefire tro MATH10_ENV_FILE vao duong dan khong ton tai, nen import ../.env.staging rong
#   2. cac gia tri duoi day la gia; neu vi ly do nao do co ket noi that thi no cung tro ve 127.0.0.1
#
# DataSource that do @AutoConfigureEmbeddedDatabase cap, ghi de bean nay luc chay.
DATABASE_URL=jdbc:postgresql://127.0.0.1:1/khong-dung-toi
DATABASE_USERNAME=math10_test
DATABASE_PASSWORD=math10_test

# Flyway trong application.yml tu mo ket noi rieng bang ${DATABASE_DIRECT_URL:${DATABASE_URL}}.
# De trong thi Spring Boot bo qua va Flyway dung DataSource cua ung dung — tuc la CSDL nhung.
# Day la dong quan trong nhat file nay: thieu no thi test se chay migration len staging.
spring.flyway.url=
spring.flyway.user=
spring.flyway.password=

# Hibernate phai soi lai schema do Flyway vua dung, khong duoc tu sinh bang.
spring.jpa.hibernate.ddl-auto=validate

JWT_SECRET=chuoi-bi-mat-chi-dung-trong-test-khong-phai-bi-mat-that-0123456789

# Khong seed du lieu E2E, khong goi ra ngoai.
E2E_SEED_ENABLED=false
E2E_ADMIN_SEED_ENABLED=false
R2_ACCOUNT_ID=
R2_ACCESS_KEY=
R2_SECRET_KEY=

logging.level.org.flywaydb=INFO
